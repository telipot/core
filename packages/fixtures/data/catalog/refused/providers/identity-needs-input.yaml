provider: identity-needs-input
display_name: Test identity-needs-input
base_url: https://api.example.com
docs_url: https://docs.example.com
source: { docs: https://docs.example.com, openapi: null, curated: 2026-10-04 }
version: 2026-10-04
auth:
  schemes:
    oauth:
      type: oauth2
      authorization_url: https://auth.example.com/authorize
      token_url: https://auth.example.com/token
      pkce: true
      refresh: static
      principals: [user]
      scopes:
        read: https://scopes.example.com/read
identity: { task: identity-needs-input.data.get, account_path: email, label_path: email }
endpoints:
  - id: identity-needs-input.data.get
    capability: test.data.get
    platform: test
    method: GET
    path: /data/{id}
    name: Test record by id
    summary: Gets a record
    input:
      pathParams:
        id: { type: string, required: true }
    output: { type: object }
    auth: oauth
    scope: own_account
    principal: user
    required_scopes: [read]
