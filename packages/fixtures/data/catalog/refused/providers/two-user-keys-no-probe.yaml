provider: two-user-keys-no-probe
display_name: Test two-user-keys-no-probe
base_url: https://api.example.com
docs_url: https://docs.example.com
source: { docs: https://docs.example.com, openapi: null, curated: 2026-10-11 }
version: 2026-10-11
# Refused for nothing: with no probe, no rule on the scheme a probe sends a key in reaches it,
# however many schemes an end user's key may go in.
auth:
  schemes:
    org_key: { type: api_key, in: header, name: X-API-Key, principals: [organization] }
    user_bearer: { type: bearer, principals: [user] }
    user_query: { type: api_key, in: query, name: key, principals: [user] }
endpoints:
  - id: two-user-keys-no-probe.data.get
    capability: test.data.get
    platform: test
    method: GET
    path: /data
    name: Test record by id
    summary: Gets a record
    input: {}
    output: { type: object }
    auth: org_key
    scope: any_account
