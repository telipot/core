name: Checks

# Runs on every pull request, from anyone: no secret is used, and the checkout leaves no token.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Each commit's author signs off the Developer Certificate of Origin with `git commit -s`.
          unsigned=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            email=$(git log -1 --format=%ae "$commit")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$email>"; then
              echo "::error::commit $(git rev-parse --short "$commit") has no Signed-off-by line from its author"
              unsigned=1
            fi
          done
          exit $unsigned
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Find where the change started
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=$(git merge-base origin/main HEAD)
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            base=$BEFORE
            git cat-file -e "${base}^{commit}" 2>/dev/null ||
              base=$(git rev-parse --verify --quiet HEAD^ || git hash-object -t tree /dev/null)
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
      - name: telipot catalog validate
        run: |
          # Before the catalog's first commit there is no earlier lock to hold the ids to.
          if git show "${BASE}:catalog/ids.lock.json" > "$RUNNER_TEMP/ids.lock.json" 2>/dev/null; then
            bun run telipot catalog validate catalog --previous-lock "$RUNNER_TEMP/ids.lock.json"
          else
            bun run telipot catalog validate catalog
          fi
      - name: telipot catalog scan
        run: bun run telipot catalog scan --base "$BASE"
      - run: bun run check-types
      - run: bun run test
      - name: A release builds
        run: bun run build
