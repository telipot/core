# yaml-language-server: $schema=../provider.schema.json
provider: apollo
display_name: Apollo
base_url: https://api.apollo.io/api/v1
docs_url: https://docs.apollo.io/reference/apollo-api
source:
  {
    docs: https://docs.apollo.io/reference/apollo-api,
    openapi: https://docs.apollo.io/openapi/apollo-rest-api.json,
    curated: 2026-10-05,
  }
version: 2026-10-05
pricing_url: https://www.apollo.io/pricing
limits: "Per team and per endpoint, in minute, hour and day windows that depend on the plan (Free 50/min, 200/hour, 600/day; paid plans 200/min on most routes and 1,000/min on enrichment); a breach returns 429 with a retry-after header."
auth:
  schemes:
    api_key: { type: api_key, in: header, name: x-api-key, principals: [organization] }
identity:
  task: apollo.account.profile
  account_path: team_id
  label_path: email
probe:
  path: /auth/health
  expect: { json_path: is_logged_in, equals: true }
proposed_capabilities:
  people.search: "People who match title, seniority and company filters"
  people.enrich: "A person's profile from a name, email or LinkedIn URL"
  company.search: "Companies that match industry, size and location filters"
  company.enrich: "A company's profile from its domain"
  account.usage: "Credits or units used and left on the credential's account"
  people.enrich.bulk: "Profiles of up to ten people from names, emails or LinkedIn URLs in one call"
  company.enrich.bulk: "Profiles of up to ten companies from their domains in one call"
  company.jobs: "Job postings a company currently has open"
  company.news: "News articles about a company"
  account.profile: "The user and team a credential acts as"
  people.contacts.search: "Contacts saved in the credential's own account that match a keyword, stage or label"
  people.contacts.create: "Save a person as a contact in the credential's own account"
  email.sequences.search: "Email outreach sequences in the credential's own account that match a name"
endpoints:
  - id: apollo.people.search
    capability: people.search
    platform: people
    auth: api_key
    scope: any_account
    principal: organization
    kind: data
    method: POST
    path: "/mixed_people/api_search"
    name: "People's titles and employers by role, company, location"
    summary: "Use the people API search endpoint to find new prospects."
    input:
      queryParams:
        "person_titles[]":
          type: array
          required: false
          example: ["marketing manager"]
          note: "Job titles to find; a person matches any one of them, and similar titles are included unless include_similar_titles is false. Pair with person_seniorities[]. Examples: sales development representative; marketing manager; research analyst."
        include_similar_titles:
          {
            type: boolean,
            required: false,
            note: "Set false to return only strict matches for person_titles[].",
          }
        q_keywords: { type: string, required: false, note: "Words to filter the results over." }
        q_person_name:
          type: string
          required: false
          note: "Name of the person. Matches people whose name contains every word given, independent of other filters."
        "person_locations[]":
          type: array
          required: false
          note: "Where people live: cities, US states or countries. Examples: california; ireland; chicago."
        "person_seniorities[]":
          type: array
          required: false
          note: "Seniority of the person's current title; a person matches any one given. Options: owner, founder, c_suite, partner, vp, head, director, manager, senior, entry, intern."
        "organization_locations[]":
          type: array
          required: false
          note: "Headquarters location of the person's current employer: cities, US states or countries. Examples: texas; tokyo; spain."
        "q_organization_domains_list[]":
          type: array
          required: false
          example: [stripe.com]
          note: "Employer domains, current or previous, without www. or @; up to 1,000. Examples: apollo.io; microsoft.com."
          max: 1000
        "contact_email_status[]":
          type: array
          required: false
          note: "Email statuses to include: verified, unverified, likely to engage, unavailable."
        "organization_ids[]":
          type: array
          required: false
          note: "Apollo IDs of employers to include; organization search returns them as id."
        "organization_num_employees_ranges[]":
          type: array
          required: false
          note: "Employer headcount ranges as lower,upper strings. Examples: 1,10; 250,500; 10000,20000."
        "revenue_range[min]":
          type: integer
          required: false
          note: "Minimum employer revenue, digits only (no currency symbol, comma or decimal point). Pair with revenue_range[max]."
        "revenue_range[max]":
          type: integer
          required: false
          note: "Maximum employer revenue, digits only. Pair with revenue_range[min]."
        "currently_using_all_of_technology_uids[]":
          type: array
          required: false
          note: "Employer must use all of these. Technology uids; replace spaces and periods with underscores. Apollo filters on 1,500+ technologies. Examples: salesforce; google_analytics; wordpress_org."
        "currently_using_any_of_technology_uids[]":
          type: array
          required: false
          note: "Employer must use any of these. Technology uids; replace spaces and periods with underscores. Apollo filters on 1,500+ technologies. Examples: salesforce; google_analytics; wordpress_org."
        "currently_not_using_any_of_technology_uids[]":
          type: array
          required: false
          note: "Exclude people whose employer uses any of these. Technology uids; replace spaces and periods with underscores. Apollo filters on 1,500+ technologies. Examples: salesforce; google_analytics; wordpress_org."
        "q_organization_job_titles[]":
          type: array
          required: false
          note: "Job titles in active job postings at the person's current employer. Examples: sales manager; research analyst."
        "organization_job_locations[]":
          type: array
          required: false
          note: "Locations of the jobs the person's employer is recruiting for. Examples: atlanta; japan."
        "organization_num_jobs_range[min]":
          type: integer
          required: false
          note: "Minimum number of active job postings at the employer. Pair with organization_num_jobs_range[max]."
        "organization_num_jobs_range[max]":
          {
            type: integer,
            required: false,
            note: "Maximum number of active job postings at the employer.",
          }
        "organization_job_posted_at_range[min]":
          type: string
          required: false
          example: "2025-07-25"
          note: "Earliest date the employer posted jobs, YYYY-MM-DD. Pair with organization_job_posted_at_range[max]."
        "organization_job_posted_at_range[max]":
          type: string
          required: false
          example: "2025-09-25"
          note: "Latest date the employer posted jobs, YYYY-MM-DD."
        organization_headcount_growth_past_n_months:
          type: integer
          required: false
          note: "Trailing window in months for employer headcount growth. Has no effect unless sent with organization_headcount_growth_range[min] or [max]."
          enum: [6, 12, 24]
        "organization_headcount_growth_range[min]":
          type: integer
          required: false
          note: "Minimum employer headcount growth as a whole-number percentage over the window; 10 means 10%. Needs organization_headcount_growth_past_n_months."
        "organization_headcount_growth_range[max]":
          type: integer
          required: false
          note: "Maximum employer headcount growth as a whole-number percentage over the window. Needs organization_headcount_growth_past_n_months."
        "lookalike_organization_ids[]":
          type: array
          required: false
          note: "Apollo IDs of up to 5 seed companies; results narrow to people at similar companies and exclude the seeds. A seed with no lookalike data returns no results."
          max: 5
        "not_organization_websites_list[]":
          type: array
          required: false
          note: "Exclude people whose current employer matches any of these domains, including the company's other known domains."
        page:
          type: integer
          required: false
          example: 1
          note: "Page to return, up to 500 pages of 100; use with per_page."
          min: 1
          max: 500
        per_page:
          type: integer
          required: false
          example: 10
          note: "Results per page, up to 100. Apollo caps a search at 50,000 records."
          min: 1
          max: 100
    untestable: "Answers with named people, their titles and employers; a contact lookup, so it has no test request."
    cost: { type: free }
    docs_url: "https://docs.apollo.io/reference/people-api-search"
    output:
      type: object
      properties:
        total_entries:
          {
            type: integer,
            description: "The total number of people that match your search criteria.",
          }
        people:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              first_name: { type: string }
              last_name_obfuscated:
                {
                  type: string,
                  description: "First 2 characters, asterisks, then the last character.",
                }
              title: { type: [string, "null"] }
              last_refreshed_at: { type: string }
              has_email: { type: boolean }
              has_city: { type: boolean }
              has_state: { type: boolean }
              has_country: { type: boolean }
              has_direct_phone:
                { type: string, description: "Yes, or a Maybe note when Apollo is uncertain." }
              organization:
                type: object
                properties:
                  name: { type: string }
                  has_industry: { type: boolean }
                  has_phone: { type: boolean }
                  has_city: { type: boolean }
                  has_state: { type: boolean }
                  has_country: { type: boolean }
                  has_zip_code: { type: boolean }
                  has_revenue: { type: boolean }
                  has_employee_count: { type: boolean }
  - id: apollo.people.enrich
    capability: people.enrich
    platform: people
    auth: api_key
    scope: any_account
    principal: organization
    kind: data
    method: POST
    path: "/people/match"
    name: "Person's title, work email from email, LinkedIn URL or name"
    summary: "Use the people enrichment endpoint to enrich data for one person."
    input:
      queryParams:
        first_name: { type: string, required: false, note: "First name; use with last_name." }
        last_name: { type: string, required: false, note: "Last name; use with first_name." }
        name:
          type: string
          required: false
          note: "Full name; replaces first_name and last_name. Identify the person with an email, a LinkedIn URL, an Apollo ID, or a name plus employer domain; a name alone may return a 200 with no match (check match_confidence)."
        email: { type: string, required: false, note: "Email address of the person." }
        hashed_email:
          { type: string, required: false, note: "MD5 or SHA-256 hash of the person's email." }
        organization_name:
          {
            type: string,
            required: false,
            note: "Name of the person's employer, current or previous.",
          }
        domain:
          type: string
          required: false
          example: apollo.io
          note: "Domain of the person's employer, current or previous, without www. or @."
        id:
          {
            type: string,
            required: false,
            note: "Apollo ID of the person, as people search returns it.",
          }
        linkedin_url:
          { type: string, required: false, note: "URL of the person's LinkedIn profile." }
    untestable: "Needs a specific person and answers with that person's profile and work email; a contact lookup, so it has no test request."
    cost:
      type: per_success
      value: 1
      currency: credit
      source: docs
      source_url: "https://docs.apollo.io/docs/api-pricing"
      checked: "2026-10-05"
      confidence: documented
      note: "1 credit when credit-consuming data (demographics or email) is found, 0 when none is. The docs give 1-9 credits per person: +8 when a mobile phone is returned, and waterfall enrichment costs more. This task sends no phone, personal-email or waterfall option, so it is priced at the 1-credit base."
    docs_url: "https://docs.apollo.io/reference/people-enrichment"
    output:
      type: object
      properties:
        request_id:
          {
            type: integer,
            description: "Save to map this request to a webhook result; this task sends no webhook.",
          }
        person:
          type: object
          properties:
            id: { type: string }
            first_name: { type: string }
            last_name: { type: string }
            name: { type: string }
            linkedin_url: { type: string }
            title: { type: string }
            headline: { type: string }
            email: { type: string }
            email_status: { type: string }
            organization_id: { type: string }
            match_confidence: { type: string, enum: [high, medium, low, none] }
            employment_history:
              type: array
              items:
                type: object
                properties:
                  organization_id: { type: string }
                  organization_name: { type: string }
                  title: { type: string }
                  start_date: { type: string }
                  current: { type: boolean }
            state: { type: string }
            city: { type: string }
            country: { type: string }
            seniority: { type: string }
            departments:
              type: array
              items: { type: string }
            subdepartments:
              type: array
              items: { type: string }
            functions:
              type: array
              items: { type: string }
            organization:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                website_url: { type: string }
                primary_domain: { type: string }
                industry: { type: string }
                estimated_num_employees: { type: integer }
  - id: apollo.people.enrich.bulk
    capability: people.enrich.bulk
    platform: people
    auth: api_key
    scope: any_account
    principal: organization
    kind: data
    method: POST
    path: "/people/bulk_match"
    name: "Up to 10 people's titles, work emails from emails or names"
    summary: "Use the bulk people enrichment endpoint to enrich data for up to ten people with a single API call."
    input:
      body:
        details:
          type: array
          required: true
          note: "One object per person, up to 10, each with any of first_name, last_name, name, email, hashed_email, organization_name, domain, id, linkedin_url. More fields improve the match; a name without a domain or email may match nothing."
          min: 1
          max: 10
      bodyType: json
    untestable: "Needs specific people and answers with their profiles and work emails; a contact lookup, so it has no test request."
    cost:
      type: per_result
      value: 1
      currency: credit
      source: docs
      source_url: "https://docs.apollo.io/docs/api-pricing"
      checked: "2026-10-05"
      confidence: documented
      settle: { type: reported_charge, path: credits_consumed }
      note: "1 credit per person when credit-consuming data (demographics or email) is found, 0 for an unmatched person. The docs give 1-9 credits per person: +8 when a mobile phone is returned, and waterfall enrichment costs more. This task sends no phone, personal-email or waterfall option, so it is priced at the 1-credit base per person. credits_consumed reports what the call used and can be a decimal."
    docs_url: "https://docs.apollo.io/reference/bulk-people-enrichment"
    output:
      type: object
      required: [status, total_requested_enrichments]
      properties:
        request_id: { type: integer, description: "A signed 64-bit integer that may be negative." }
        status:
          {
            type: string,
            description: "success for any 200 response, even when not every person matched.",
          }
        error_code: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
        total_requested_enrichments:
          { type: integer, description: "The number of objects sent in details. Always returned." }
        unique_enriched_records:
          type: integer
          description: "Distinct people whose enrichment consumed credits; a billing count, not a match count."
        missing_records:
          { type: integer, description: "Entries in details that Apollo could not match." }
        credits_consumed:
          { type: number, description: "Credits the request consumed; can be a decimal." }
        matches:
          type: array
          items:
            type: [object, "null"]
            description: "One entry per person; an unmatched person is null."
            properties:
              id: { type: string }
              first_name: { type: string }
              last_name: { type: string }
              name: { type: string }
              linkedin_url: { type: string }
              title: { type: string }
              headline: { type: string }
              email: { type: string }
              email_status: { type: string }
              organization_id: { type: string }
              match_confidence: { type: string, enum: [high, medium, low, none] }
              employment_history:
                type: array
                items:
                  type: object
                  properties:
                    organization_id: { type: string }
                    organization_name: { type: string }
                    title: { type: string }
                    start_date: { type: string }
                    current: { type: boolean }
              state: { type: string }
              city: { type: string }
              country: { type: string }
              seniority: { type: string }
              departments:
                type: array
                items: { type: string }
              functions:
                type: array
                items: { type: string }
              organization:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  website_url: { type: string }
                  primary_domain: { type: string }
                  industry: { type: string }
                  estimated_num_employees: { type: integer }
  - id: apollo.company.search
    capability: company.search
    platform: company
    auth: api_key
    scope: any_account
    principal: organization
    kind: data
    method: POST
    path: "/mixed_companies/search"
    name: "Companies by domain, size, location, funding, tech filters"
    summary: "Use the organization search endpoint to find companies in the Apollo database."
    input:
      queryParams:
        "q_organization_domains_list[]":
          type: array
          required: false
          example: [stripe.com]
          note: "Company domains, without www. or @; up to 1,000. Examples: apollo.io; microsoft.com."
          max: 1000
        "organization_num_employees_ranges[]":
          type: array
          required: false
          note: "Headcount ranges as lower,upper strings. Examples: 1,10; 250,500; 10000,20000."
        "organization_locations[]":
          type: array
          required: false
          note: "Headquarters location: cities, US states or countries. Examples: texas; tokyo; spain."
        "organization_not_locations[]":
          type: array
          required: false
          note: "Exclude companies by headquarters location: cities, US states or countries. Examples: minnesota; ireland."
        "revenue_range[min]":
          type: integer
          required: false
          note: "Minimum revenue, digits only (no currency symbol, comma or decimal point). Pair with revenue_range[max]."
        "revenue_range[max]":
          {
            type: integer,
            required: false,
            note: "Maximum revenue, digits only. Pair with revenue_range[min].",
          }
        "currently_using_any_of_technology_uids[]":
          type: array
          required: false
          note: "Company must use any of these. Technology uids; replace spaces and periods with underscores. Apollo filters on 1,500+ technologies. Examples: salesforce; google_analytics; wordpress_org."
        "q_organization_keyword_tags[]":
          type: array
          required: false
          note: "Keywords associated with companies. Examples: mining; sales strategy; consulting."
        q_organization_name:
          type: string
          required: false
          note: "Company name; partial matches are accepted, so marketing matches NY Marketing Unlimited."
        "organization_ids[]":
          {
            type: array,
            required: false,
            note: "Apollo IDs of companies to include; this route returns them as id.",
          }
        "latest_funding_amount_range[min]":
          type: integer
          required: false
          note: "Minimum amount of the most recent funding round, digits only. Pair with latest_funding_amount_range[max]."
        "latest_funding_amount_range[max]":
          {
            type: integer,
            required: false,
            note: "Maximum amount of the most recent funding round, digits only.",
          }
        "total_funding_range[min]":
          type: integer
          required: false
          note: "Minimum total funding across all rounds, digits only. Pair with total_funding_range[max]."
        "total_funding_range[max]":
          {
            type: integer,
            required: false,
            note: "Maximum total funding across all rounds, digits only.",
          }
        "latest_funding_date_range[min]":
          type: string
          required: false
          example: "2025-07-25"
          note: "Earliest date of the most recent funding round, YYYY-MM-DD. Pair with latest_funding_date_range[max]."
        "latest_funding_date_range[max]":
          type: string
          required: false
          example: "2025-09-25"
          note: "Latest date of the most recent funding round, YYYY-MM-DD."
        "q_organization_job_titles[]":
          type: array
          required: false
          note: "Job titles in the company's active job postings. Examples: sales manager; research analyst."
        "organization_job_locations[]":
          type: array
          required: false
          note: "Locations of the jobs the company is recruiting for. Examples: atlanta; japan."
        "organization_num_jobs_range[min]":
          type: integer
          required: false
          note: "Minimum number of active job postings. Pair with organization_num_jobs_range[max]."
        "organization_num_jobs_range[max]":
          { type: integer, required: false, note: "Maximum number of active job postings." }
        "organization_job_posted_at_range[min]":
          type: string
          required: false
          example: "2025-07-25"
          note: "Earliest date the company posted jobs, YYYY-MM-DD. Pair with organization_job_posted_at_range[max]."
        "organization_job_posted_at_range[max]":
          type: string
          required: false
          example: "2025-09-25"
          note: "Latest date the company posted jobs, YYYY-MM-DD."
        organization_headcount_growth_past_n_months:
          type: integer
          required: false
          note: "Trailing window in months for headcount growth. Has no effect unless sent with organization_headcount_growth_range[min] or [max]."
          enum: [6, 12, 24]
        "organization_headcount_growth_range[min]":
          type: integer
          required: false
          note: "Minimum headcount growth as a whole-number percentage over the window; 10 means 10%. Needs organization_headcount_growth_past_n_months."
        "organization_headcount_growth_range[max]":
          type: integer
          required: false
          note: "Maximum headcount growth as a whole-number percentage over the window. Needs organization_headcount_growth_past_n_months."
        "lookalike_organization_ids[]":
          type: array
          required: false
          note: "Apollo IDs of up to 5 seed companies; results are narrowed and ranked by similarity and exclude the seeds."
          max: 5
        "not_organization_websites_list[]":
          type: array
          required: false
          note: "Exclude companies that match any of these domains, including the company's other known domains."
        page:
          type: integer
          required: false
          example: 1
          note: "Page to return, up to 500 pages of 100; use with per_page. Each page costs 1 credit."
          min: 1
          max: 500
        per_page:
          type: integer
          required: false
          example: 10
          note: "Results per page, up to 100. Apollo caps a search at 50,000 records."
          min: 1
          max: 100
    test_request:
      queryParams: { "q_organization_domains_list[]": [stripe.com], per_page: 1 }
    cost:
      type: per_call
      value: 1
      currency: credit
      source: docs
      source_url: "https://docs.apollo.io/docs/api-pricing"
      checked: "2026-10-05"
      confidence: documented
      note: "1 credit per page, up to 100 results per page; per_page does not change the charge."
    docs_url: "https://docs.apollo.io/reference/organization-search"
    output:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total_entries: { type: integer }
            total_pages: { type: integer }
        partial_results_only: { type: boolean }
        partial_results_limit: { type: integer }
        organizations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              website_url: { type: string }
              linkedin_url: { type: string }
              twitter_url: { type: string }
              facebook_url: { type: string }
              primary_domain: { type: string }
              founded_year: { type: integer }
              alexa_ranking: { type: integer }
              logo_url: { type: string }
              languages:
                type: array
                items: { type: string }
              phone: { type: string }
        accounts: { type: array }
  - id: apollo.company.enrich
    capability: company.enrich
    platform: company
    auth: api_key
    scope: any_account
    principal: organization
    kind: data
    method: GET
    path: "/organizations/enrich"
    name: "Company's industry, size, revenue, funding from its domain"
    summary: "Use the organization enrichment endpoint to enrich data for one company."
    input:
      queryParams:
        domain:
          type: string
          required: false
          example: stripe.com
          note: "Domain of the company, without www. or @. Identify the company with domain, linkedin_url or website."
        linkedin_url:
          type: string
          required: false
          example: "https://www.linkedin.com/company/apolloio"
          note: "URL of the company's LinkedIn profile."
        name:
          type: string
          required: false
          example: apollo
          note: "Company name; improves a match, but name alone is not supported."
        website:
          {
            type: string,
            required: false,
            example: "http://www.apollo.io",
            note: "Full website URL of the company.",
          }
    test_request:
      queryParams: { domain: stripe.com }
    cost:
      type: per_result
      value: 1
      currency: credit
      source: docs
      source_url: "https://docs.apollo.io/docs/api-pricing"
      checked: "2026-10-05"
      confidence: documented
      note: "1 credit per organization."
    docs_url: "https://docs.apollo.io/reference/organization-enrichment"
    output:
      type: object
      properties:
        organization:
          type: object
