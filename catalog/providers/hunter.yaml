    scope: any_account
    principal: organization
    auth: api_key
    kind: data
    method: GET
    path: /domain-finder
    name: Domain candidates for a company name, with email counts
    summary: This API endpoint returns the most likely domain name(s) for a given company name.
    docs_url: https://hunter.io/api-documentation/v2#domain-finder
    input:
      queryParams:
        company:
          type: string
          required: true
          min: 3
          example: stripe
          note: Company name to resolve, at least 3 characters.
        limit:
          type: integer
          required: false
          min: 1
          max: 10
          default: 5
          note: Maximum suggestions returned.
        perfect_match:
          type: boolean
          required: false
          default: false
          note: true returns only suggestions very similar to the name, for one confident answer instead of a list.
    test_request: { queryParams: { company: stripe, limit: 1 } }
    cost: { type: free }
    output:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [domain, company_name]
            properties:
              domain: { type: string }
              company_name: { type: string }
              logo: { type: string }
              email_count:
                {
                  type: integer,
                  description: "Emails Hunter holds for the domain; 0 can mean a privacy-suppressed domain",
                }
        meta:
          type: object
          properties:
            results: { type: integer }
            params: { type: object }

