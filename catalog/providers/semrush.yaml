    platform: seo
    domain: domains
    scope: any_account
    principal: organization
    auth: api_key
    kind: data
    method: GET
    path: /
    name: Keyword gap between up to five domains by country
    summary: This report allows users to compare up to five domains by common keywords, unique keywords, all keywords, or search terms that are unique to the first domain.
    docs_url: https://developer.semrush.com/api/v3/seo/domain-reports/#domain-vs-domain
    input:
      queryParams:
        type:
          {
            type: string,
            required: true,
            const: domain_domains,
            note: Fixed. Selects the Domain vs. Domain report.,
          }
        domains:
          type: string
          required: true
          example: "*|or|stripe.com|*|or|paypal.com"
          note: "Up to five domains, each written sign|type|domain and all joined with |. Sign is +, -, * or /. Type is or for organic keywords or ad for paid keywords. Shared keywords: *|or|a.com|*|or|b.com. All keywords: *|or|a.com|+|or|b.com. Unique to a.com: *|or|a.com|-|or|b.com. Untapped for a.com: *|or|b.com|+|or|c.com|-|or|a.com. Missing for a.com: *|or|b.com|*|or|c.com|-|or|a.com. Keywords in only one domain: *|or|a.com|/|or|b.com. Write it in plain text; Semrush needs it URL-encoded, so the | and * must reach it as %7C and %2A."
        database:
          type: string
          required: true
          example: us
          note: Two-letter regional database code, such as us, uk, ca, de or fr. Domain reports also take the mobile- and -ext codes listed under Databases in the SEO API overview.
        display_limit:
          type: integer
          required: true
          min: 1
          max: 100000
          example: 10
          note: Lines returned, which is what Semrush bills. Semrush returns up to 10,000 lines when the parameter is omitted or 0, so this task requires it. Semrush returns at most 100,000 lines per call.
        display_offset:
          type: integer
          required: false
          min: 0
          note: Lines to skip before the report starts. Semrush counts display_limit from the first line, so set display_limit to display_offset plus the lines wanted.
        display_sort:
          type: string
          required: false
          enum:
            [
              p0_asc,
              p0_desc,
              p1_asc,
              p1_desc,
              p2_asc,
              p2_desc,
              p3_asc,
              p3_desc,
              p4_asc,
              p4_desc,
              nq_asc,
              nq_desc,
              co_asc,
              co_desc,
              cp_asc,
              cp_desc,
              nr_asc,
              nr_desc,
            ]
          note: Sort rule, one per call. p0 to p4 are the positions of the first to fifth domain.
        display_filter:
          type: string
          required: false
          note: "Filters written as sign|column|operation|value, joined with |. Sign + includes and - excludes. Columns: Ph, P0, P1, P2, P3, P4, Nq, Cp, Co, Nr, Kd. Operations: Eq, Gt, Lt for numbers; Bw, Ew, Eq, Co, Wm for text. At most 25 filters. Write it in plain text; the + must reach Semrush as %2B."
        export_columns:
          type: string
          required: false
          default: Ph,P0,P1,P2,P3,P4,Nr,Cp,Nq,Kd,Co,Td
          note: "Comma-separated column codes, in the order wanted. Ph Keyword, P0 to P4 position of the first to fifth domain in Google's top 100 (0 means not ranked), Nq Search Volume, Cp CPC in USD, Co Competition (0 to 1), Nr Number of Results, Kd Keyword Difficulty Index, Td Trends."
    test_request:
      queryParams:
        {
          type: domain_domains,
          domains: "*|or|stripe.com|*|or|paypal.com",
          database: us,
          display_limit: 1,
          export_columns: "Ph,P0,P1,Nq",
        }
    cost:
      type: per_result
      value: 80
      currency: meter
      unit: api_unit
