# Semrush, Analytics API version 3 (api.semrush.com). Curated from the vendor's documentation; Semrush
# publishes no OpenAPI. Every report is one GET: the Analytics API reports share the path / on
# api.semrush.com and are chosen by the fixed query parameter `type`; the Backlinks reports live under
# /analytics/v1/ and are chosen by `type` too. Responses are semicolon-separated text, not JSON.
#
# Semrush marks the version 3 Keyword reports and Backlinks reports deprecated ("no longer recommended for
# new integrations"); its version 4 replacements are in Early Access, need a separate version 4 key and
# answer JSON. The Domain and Overview reports used here carry no deprecation notice.
#
# Deliberately left out of every input: display_date and display_daily (historical data bills about five
# times the live price per line, and a price cannot switch on an optional field), export_escape and
# export_decode (they change the response format).
provider: semrush
display_name: Semrush
base_url: https://api.semrush.com
docs_url: https://developer.semrush.com/api/v3/seo/overview/
source:
  { docs: https://developer.semrush.com/api/v3/seo/overview/, openapi: null, curated: 2026-10-05 }
version: 2026-10-05
pricing_url: https://developer.semrush.com/api/v3/get-started/api-units-balance/
limits: Up to 10 requests per second and 10 simultaneous requests per account on every method; each report spends API units from the account's balance, per line returned or per request, and the data may not be cached for more than one month.
auth:
  schemes:
    api_key: { type: api_key, in: query, name: key, principals: [organization] }
probe:
  url: https://www.semrush.com/users/countapiunits.html
  method: GET
  auth: api_key
  expect: { status: 200, body_pattern: '^\s*[0-9][0-9,]*\s*$' }
  reject: { body_pattern: '^\s*ERROR (70|12[0-2]) ' }
terms:
  url: https://www.semrush.com/company/legal/terms-of-service/
  note: Semrush's terms of service (section 3.3) bar using its outputs as inputs or prompts into, or to develop, train or improve, any AI or machine-learning system, except Semrush's own official integrations embedded in an AI system.
proposed_capabilities:
  seo.keywords.volume: Search volume, cost per click and competition of a keyword
  seo.keywords.volume.batch: Search volume, cost per click and competition of up to 100 keywords at once
  seo.keywords.related: Keywords related to a keyword
  seo.keywords.questions: Questions people ask about a keyword
  seo.keywords.difficulty: How hard a keyword is to rank for
  seo.serp.organic: The organic results on a keyword's search page
  seo.domain.overview: Organic and paid search summary of a domain
  seo.domain.keywords: Keywords a domain ranks for in organic search, each with its rank
  seo.domain.competitors: Domains that compete with a domain in organic search
  seo.domain.pages: Pages of a domain that rank in organic search, with their keywords and traffic
  seo.domain.gap: Keywords that two or more domains rank for, compared side by side
  seo.backlinks.summary: Backlink profile of a domain or URL
  seo.backlinks.list: Backlinks that point at a domain or URL
  seo.backlinks.refdomains: Domains that link to a domain or URL
endpoints:
  - id: semrush.seo.keywords.volume
    capability: seo.keywords.volume
    platform: seo
    domain: keywords
    scope: any_account
    principal: organization
    auth: api_key
    kind: data
    method: GET
    path: /
    name: Keyword volume, CPC and competition by phrase and country
    summary: This report provides a keyword summary, including its volume, CPC, competition level, and the number of results in a chosen regional database.
    docs_url: https://developer.semrush.com/api/v3/seo/keyword-reports/#keyword-overview-one-database
    input:
      queryParams:
        type:
          {
            type: string,
            required: true,
            const: phrase_this,
            note: Fixed. Selects the Keyword Overview (one database) report.,
          }
        phrase:
          {
            type: string,
            required: true,
            example: seo,
            note: Keyword or keyword expression to investigate.,
          }
        database:
          type: string
          required: true
          example: us
          note: Two-letter regional database code, such as us, uk, ca, de or fr. Keyword reports accept the plain two-letter codes only, not the mobile- and -ext variants. The full list is under Databases in the SEO API overview.
        export_columns:
          type: string
          required: false
          default: Ph,Nq,Cp,Co,Nr
          note: "Comma-separated column codes, in the order wanted. Ph Keyword, Nq Search Volume (monthly average over the last 12 months), Cp CPC in USD, Co Competition (0 to 1, 1 is highest), Nr Number of Results, Td Trends (12 monthly values), In Intents (0 Commercial, 1 Informational, 2 Navigational, 3 Transactional), Kd Keyword Difficulty Index (0 to 100, higher is harder)."
    test_request:
      queryParams: { type: phrase_this, phrase: seo, database: us, export_columns: "Ph,Nq,Cp,Co" }
    cost:
      type: per_result
      value: 10
      currency: meter
      unit: api_unit
      source: docs
      source_url: https://developer.semrush.com/api/v3/seo/keyword-reports/#keyword-overview-one-database
      checked: 2026-10-05
      confidence: documented
      note: 10 API units per line returned, one line for this report. Semrush does not charge a request that returns no data. Semrush publishes no USD price per API unit.
    output:
      type: string
      pattern: '^(?!\s*ERROR)'
      description: "CSV text: a header line of column names, then one line per result, columns separated by semicolons, in the order of export_columns. A body that starts with ERROR is a failure, for example ERROR 50 :: NOTHING FOUND."

