      checked: 2026-10-05
      confidence: documented
      note: 80 API units per line returned. Semrush does not charge a request that returns no data. Semrush publishes no USD price per API unit.
    output:
      type: string
      pattern: '^(?!\s*ERROR)'
      description: "CSV text: a header line of column names, then one line per keyword, columns separated by semicolons, in the order of export_columns. The position columns P0 to P4 are headed by the names of the domains queried. A body that starts with ERROR is a failure, for example ERROR 50 :: NOTHING FOUND."

